/**
 * Description: Transport-neutral request-log sampling state enum.
 *
 * Owned by the log module (not a transport-specific proto) so that the
 * transport-neutral helpers in common/log/log_sample_state.h do not pull a
 * zmq-proto dependency. The zmq MetaPb field (meta_zmq.proto) and the brpc
 * trace attachment state byte both reference this enum via import / cast, so
 * the sampling contract has exactly one definition shared by both transports.
 */

syntax = "proto3";
package datasystem;

option cc_enable_arenas = true;

// Request log sampling state carried by RPC metadata.
// Converged to request-level complete-print decision via LogSampler.
enum LogSampleState {
    // Not an SDK request trace. Background and internal logs are not sampled by request_sample_rate.
    LOG_SAMPLE_NONE = 0;

    // SDK request trace admitted by request_sample_rate. Complete request logs are kept across RPC hops.
    LOG_SAMPLE_ADMIT = 1;

    // SDK request trace rejected by request_sample_rate. Request INFO/VLOG are dropped;
    // diagnostic/access continue supplemental sampling, reject is NOT a direct drop condition for them.
    LOG_SAMPLE_REJECT = 2;

    // SDK request trace without a propagated sampling decision yet.
    // The receiving side may create a local decision based on its own request_sample_rate.
    LOG_SAMPLE_UNDECIDED = 3;
}
