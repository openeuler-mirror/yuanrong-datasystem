/**
 * Description: Defines the RPC API of the lightweight coordinator component.
 */
syntax = "proto3";
package datasystem.coordinator;

option cc_enable_arenas = true;

message ResponseHeader {
  // true = this node is leader, request processed
  // false = this node is not leader, check leader_address
  bool is_leader = 1;
  string leader_address = 2; // Empty if is_leader=true or if leader unknown
  bytes coordinator_id = 3; // Unique identifier of this Coordinator process lifetime.
  uint64 leader_term = 4; // Current Raft term; 0 when no term is known.
  enum ServingStatePb {
    SERVING_STATE_UNSPECIFIED = 0;
    FOLLOWER_SERVING = 1;
    LEADER_RECOVERING = 2;
    LEADER_SERVING = 3;
    NO_LEADER = 4;
  }
  ServingStatePb serving_state = 5;
}

enum CoordinatorRecoveryStatePb {
  COORDINATOR_RECOVERY_STATE_UNSPECIFIED = 0;
  COORDINATOR_RECOVERING = 1;
  COORDINATOR_READY = 2;
  COORDINATOR_BLOCKED = 3;
}

message GetCoordinatorIdReqPb {}

message GetCoordinatorIdRspPb {
  ResponseHeader header = 1;
}

enum TopologyRecoveryCandidateResultPb {
  TOPOLOGY_RECOVERY_RESULT_UNSPECIFIED = 0;
  TOPOLOGY_RECOVERY_NO_SNAPSHOT = 1;
  TOPOLOGY_RECOVERY_SNAPSHOT = 2;
}

message ReportTopologyRecoveryCandidateReqPb {
  string cluster_name = 1;
  bytes coordinator_id = 2;
  string reporter_address = 3;
  TopologyRecoveryCandidateResultPb result = 4;
  uint64 topology_version = 5;
  bytes topology_digest = 6;
  bytes canonical_topology = 7; // Canonical payload; at most 4 MiB and empty for evidence-only reports.
  uint64 leader_term = 8; // Leader term observed by the reporter.
}

message ReportTopologyRecoveryCandidateRspPb {
  enum ResultPb {
    RESULT_UNSPECIFIED = 0;
    ACCEPTED = 1;
    COORDINATOR_ID_MISMATCH = 2;
    MEMBERSHIP_NOT_READY = 3;
    STALE_LEADER_TERM = 4;
  }
  ResponseHeader header = 1;
  ResultPb result = 2;
  CoordinatorRecoveryStatePb recovery_state = 3;
  bool payload_required = 4;
}

message EnsureLeaderMembershipReqPb {
  string cluster_name = 1;
  string reporter_address = 2;
  bytes coordinator_id = 3;
  uint64 leader_term = 4;
  bytes membership_value = 5;
  int64 ttl_ms = 6;
}

message EnsureLeaderMembershipRspPb {
  ResponseHeader header = 1;
  enum ResultPb {
    RESULT_UNSPECIFIED = 0;
    ACCEPTED = 1;
    STALE_EPOCH = 2;
    INVALID_MEMBERSHIP = 3;
  }
  ResultPb result = 2;
  int64 remaining_ttl_ms = 3;
  // Modification revision of the membership recreated by an ACCEPTED response.
  int64 membership_mod_revision = 4;
}

message WorkerProbeEventValuePb {
  string cluster_name = 1;
  uint64 probe_round = 2;
  string target_address = 3;
  bytes target_member_id = 4;
  bytes coordinator_id = 5;
}

enum WorkerLivenessResultPb {
  WORKER_LIVENESS_UNKNOWN = 0;
  WORKER_REACHABLE = 1;
  WORKER_UNREACHABLE = 2;
}

message ReportWorkerLivenessReqPb {
  string cluster_name = 1;
  string witness_address = 2;
  string target_address = 3;
  bytes target_member_id = 4;
  uint64 probe_round = 5;
  WorkerLivenessResultPb result = 6;
  bytes coordinator_id = 7;
}

message ReportWorkerLivenessRspPb {
  ResponseHeader header = 1;
}

message PutReqPb {
  bytes key = 1;
  bytes value = 2;
  int64 ttl = 3; // TTL in milliseconds. 0 means no expiration.
  int64 expected_version = 4; // -1 disables CAS; 0 requires absence; positive values match the key version.
  bytes expected_coordinator_id = 5; // Empty disables the process-lifetime fence.
  int64 expected_mod_revision = 6; // Zero disables the membership-incarnation fence.
}

message PutRspPb {
  ResponseHeader header = 1;
  int64 version = 2;
  int64 revision = 3;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  int64 version = 3;
  int64 mod_revision = 4;
}

message GetClusterRawSnapshotReqPb {
  string cluster_name = 1;
}

message GetClusterRawSnapshotRspPb {
  ResponseHeader header = 1;
  repeated KeyValue topology_kvs = 2;
  repeated KeyValue membership_kvs = 3;
}

message WorkerServiceInfoPb {
  enum StatePb {
    UNSPECIFIED = 0;
    START = 1;
    RESTART = 2;
    RECOVER = 3;
    READY = 4;
    EXITING = 5;
    DOWNGRADE_RESTART = 6;
  }
  int64 timestamp = 1;
  StatePb state = 2;
  string host_id = 3;
  string compatibility_version = 4;
}

message RangeReqPb {
  bytes key = 1;
  bytes range_end = 2;
  int64 known_mod_revision = 3; // Exact-key revision already held by the caller; zero disables conditional read.
}

message RangeRspPb {
  ResponseHeader header = 1;
  repeated KeyValue kvs = 2;
  int64 revision = 3;
  bool unchanged = 4; // True when known_mod_revision matches; kvs is omitted.
}

message DeleteRangeReqPb {
  bytes key = 1;
  bytes range_end = 2;
  bytes expected_coordinator_id = 3; // Empty disables the process-lifetime fence.
  int64 expected_mod_revision = 4; // Exact-key membership incarnation; zero disables the fence.
}

message DeleteRangeRspPb {
  ResponseHeader header = 1;
  int64 deleted = 2;
  int64 revision = 3;
}

message WatchRangeReqPb {
  bytes key = 1;
  bytes range_end = 2;
  string watcher_addr = 3;
  // Client-assigned idempotency key; an identical retry returns the original watch_id.
  bytes registration_id = 4;
}

message WatchRangeRspPb {
  ResponseHeader header = 1;
  int64 watch_id = 2;
  repeated KeyValue initial_kvs = 3;
}

message CancelWatchReqPb {
  string watcher_addr = 1;
  repeated int64 watch_ids = 2;
  // Required identity of the Coordinator process that created watch_ids.
  bytes expected_coordinator_id = 3;
}

message CancelWatchRspPb {
  ResponseHeader header = 1;
}

message KeepAliveReqPb {
  bytes key = 1;
  bytes expected_coordinator_id = 2; // Required after the Worker observes one Coordinator process.
  int64 expected_mod_revision = 3; // Current membership incarnation; zero disables the fence.
  repeated string failed_targets = 4; // Target workers observed as persistently unreachable by this member.
}

message KeepAliveRspPb {
  ResponseHeader header = 1;
  int64 ttl = 2; // Original TTL in milliseconds.
  int64 remaining_ttl = 3; // Remaining TTL in milliseconds after renewal.
}

enum RaftMetadataStatePb {
  RAFT_METADATA_UNKNOWN = 0;
  RAFT_METADATA_ABSENT = 1;
  RAFT_METADATA_VALID = 2;
  RAFT_METADATA_CORRUPT = 3;
}

enum RaftBootstrapPhasePb {
  RAFT_BOOTSTRAP_OBSERVING = 0;
  RAFT_BOOTSTRAP_RETRYING = 1;
  RAFT_BOOTSTRAP_STARTED = 2;
  RAFT_BOOTSTRAP_TERMINAL = 3;
}

message GetRaftBootstrapStateReqPb {
  string group_id = 1;
}

message GetRaftBootstrapStateRspPb {
  bool probe_ready = 1;
  string group_id = 2;
  string local_peer = 3;
  uint64 expected_member_count = 4;
  RaftMetadataStatePb metadata_state = 5;
  uint64 candidate_count = 6;
  string candidate_digest = 7;
  repeated string committed_peers = 8;
  RaftBootstrapPhasePb phase = 9;
  int32 status_code = 10;
}

service CoordinatorService {
  rpc Put(PutReqPb) returns (PutRspPb) {}
  rpc Range(RangeReqPb) returns (RangeRspPb) {}
  rpc DeleteRange(DeleteRangeReqPb) returns (DeleteRangeRspPb) {}
  rpc WatchRange(WatchRangeReqPb) returns (WatchRangeRspPb) {}
  rpc CancelWatch(CancelWatchReqPb) returns (CancelWatchRspPb) {}
  rpc KeepAlive(KeepAliveReqPb) returns (KeepAliveRspPb) {}
  rpc GetCoordinatorId(GetCoordinatorIdReqPb) returns (GetCoordinatorIdRspPb) {}
  rpc ReportTopologyRecoveryCandidate(ReportTopologyRecoveryCandidateReqPb)
      returns (ReportTopologyRecoveryCandidateRspPb) {}
  rpc GetClusterRawSnapshot(GetClusterRawSnapshotReqPb) returns (GetClusterRawSnapshotRspPb) {}
  rpc GetRaftBootstrapState(GetRaftBootstrapStateReqPb) returns (GetRaftBootstrapStateRspPb) {}
  // Append-only: the generated brpc stubs dispatch by service method index, so existing RPCs above must keep their order.
  rpc EnsureLeaderMembership(EnsureLeaderMembershipReqPb) returns (EnsureLeaderMembershipRspPb) {}
  rpc ReportWorkerLiveness(ReportWorkerLivenessReqPb) returns (ReportWorkerLivenessRspPb) {}
}

message EventPb {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    PUT = 1;
    DELETE = 2;
    // Payload-free signal: discard incremental assumptions, exact-read state and re-register watches.
    RESET = 3;
  }
  EventType type = 1;
  KeyValue kv = 2;
}

message EventReqPb {
  int64 watch_id = 1;
  repeated EventPb events = 2;
  bytes coordinator_id = 3;
}

message EventRspPb {}

service CoordinatorWatchService {
  rpc HandleEvent(EventReqPb) returns (EventRspPb) {}
}
