name: "Bug 报告"
description: "报告可复现的问题，帮助维护者快速定位并修复"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        感谢提交问题。请尽量提供可执行的复现步骤和原始日志。

        **标题建议：组件 + 触发场景 + 异常现象 + 期望结果**

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索现有 Issue，未发现相同问题。"
          required: true
        - label: "我已移除日志和配置中的密码、Token、业务数据等敏感信息。"
          required: true

  - type: input
    id: version
    attributes:
      label: "DataSystem 版本"
      description: "执行 dscli --version（或 dscli --help）获取；源码部署请同时提供 git rev-parse HEAD 的输出。"
      placeholder: "例如：v0.9.2 (commit: 0123456789abcdef)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "部署与运行环境"
      description: "请提供实际部署命令或配置；UB、昇腾/CANN 信息仅在涉及相关功能时填写。"
      placeholder: |
        - 操作系统及 CPU 架构：
        - 进程部署命令：dscli start -f ./worker_config.json
        - 进程部署配置：上传脱敏后的 worker_config.json，或填写关键配置参数
        - Kubernetes：helm install RELEASE CHART -f values.yaml（请同时上传实际 values.yaml）
        - Worker 规模与组网：Worker 数量、节点分布、单机/多机及跨节点/跨网段情况
        - UB（如涉及）：设备型号、驱动/固件版本、URMA 相关配置
        - 昇腾/CANN（如涉及）：NPU 型号、驱动/固件/CANN 版本、Remote H2D 配置
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题现象"
      description: "说明问题发生的场景、执行的操作和实际结果。"
      placeholder: |
        示例：KVClient Get 请求返回 K_NOT_FOUND。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "最小复现步骤"
      description: "提供最少依赖、可重复执行的步骤或测试用例。"
      placeholder: |
        前置条件：

        1. 使用 KVClient Set 写入 test-key。
        2. 使用 KVClient Get 读取 test-key。
        3. 记录返回值或错误码。

        复现命令或测试：
        可选测试用例：如有，请贴出相关测试用例或代码片段；没有可填“无”。
        发生频率：必现 / 偶现（约 __ 次中出现 __ 次）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望结果"
      description: "说明上述操作的正确结果。"
      placeholder: |
        示例：KVClient Get 请求成功并返回已写入的数据。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "日志与错误信息"
      description: |
        优先直接上传日志文件或压缩包；无法上传时粘贴关键文本，截图仅用于界面问题。
        进程部署从 worker_config.json 的 log_dir 获取日志路径；Kubernetes 从 values.yaml 的 global.log.logDir 获取。
        集群日志：dscli collect_log -f ./cluster_config.json -d /path/to/logs -o ./datasystem-logs
        Trace 日志：从客户端错误或 access 日志复制 traceId，再执行 grep -R -F "TRACE_ID" /path/to/logs > trace.log
      placeholder: "将日志文件拖拽到此处，或粘贴问题发生前后的关键日志；请保留时间戳、错误码和 traceId。"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "补充信息"
      description: "可提供相关 Issue/PR、最近改动、正常版本与异常版本或临时规避方法。"
      placeholder: "可选；没有补充信息时可以留空。"
    validations:
      required: false
