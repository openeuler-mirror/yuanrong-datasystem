name: "Bug 报告"
description: "报告可复现的问题，帮助维护者快速定位并修复"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        感谢提交问题。请尽量提供可执行的复现步骤和原始日志。

        **标题建议：组件 + 触发场景 + 异常现象 + 期望结果**

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索现有 Issue，未发现相同问题。"
          required: true
        - label: "我已移除日志和配置中的密码、Token、业务数据等敏感信息。"
          required: true

  - type: dropdown
    id: component
    attributes:
      label: "主要组件"
      description: "请选择最可能出现问题的组件，便于快速确定排查入口。"
      options:
        - "Client / SDK"
        - "Worker"
        - "Master"
        - "ETCD / 集群管理"
        - "数据传输（SHM / TCP / UB）"
        - "编译 / 安装 / 部署"
        - "测试"
        - "其他 / 不确定"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题现象"
      description: "说明问题发生的场景、执行的操作和实际结果。"
      placeholder: |
        示例：
        Worker 重启后，客户端第一次 Get 请求返回 K_RPC_UNAVAILABLE，
        后续请求可以恢复。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望结果与验收标准"
      description: "说明正确行为，以及修复后如何判断问题已经解决。"
      placeholder: |
        示例：
        Worker 重启期间，客户端应自动切换到可用节点；
        连续执行 100 次 Get 请求均成功。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "最小复现步骤"
      description: "提供最少依赖、可重复执行的步骤、命令或测试用例。"
      placeholder: |
        前置条件：

        1. 启动或部署……
        2. 执行……
        3. 触发……

        复现命令或测试：
        可选测试用例：如有，请贴出相关测试用例或代码片段；没有可填“无”。
        发生频率：必现 / 偶现（约 __ 次中出现 __ 次）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "DataSystem 版本"
      description: "请填写 release、tag 或完整 commit SHA。"
      placeholder: "例如：v0.9.2 或 0123456789abcdef"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "只填写与问题相关的信息。"
      placeholder: |
        - 操作系统及 CPU 架构：
        - 部署方式：dscli 裸进程 / Kubernetes（Helm）/ 其他
        - Worker 部署参数、数量及组网：
        - 集群管理：ETCD / Coordinator / Metastore
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "日志与错误信息"
      description: "粘贴问题发生前后的原始日志，尽量保留时间戳、错误码和 traceId。"
      placeholder: "请直接粘贴文本，不要只上传截图。"
      render: shell
    validations:
      required: false

  - type: textarea
    id: clues
    attributes:
      label: "相关线索"
      description: "可提供相关文件或函数、正常版本与异常版本、Issue/PR、最近改动、临时规避方法或较大日志附件。"
      placeholder: "可选；没有相关线索时可以留空。"
    validations:
      required: false
